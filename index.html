<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Quote Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .form-container {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .error {
            color: #e53e3e;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error.show {
            display: block;
        }

        input.invalid,
        select.invalid {
            border-color: #e53e3e;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            animation: slideIn 0.3s ease-out;
        }

        .result.show {
            display: block;
        }

        .result.success {
            background: #f0fdf4;
            border: 2px solid #86efac;
        }

        .result.referral {
            background: #fef3c7;
            border: 2px solid #fbbf24;
        }

        .result.declined {
            background: #fee2e2;
            border: 2px solid #fca5a5;
        }

        .result h2 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .result.success h2 {
            color: #166534;
        }

        .result.referral h2 {
            color: #92400e;
        }

        .result.declined h2 {
            color: #991b1b;
        }

        .quote-details {
            display: grid;
            gap: 12px;
        }

        .quote-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .quote-row:last-child {
            border-bottom: none;
            font-weight: 700;
            font-size: 18px;
            padding-top: 15px;
        }

        .quote-label {
            color: #666;
        }

        .quote-value {
            font-weight: 600;
            color: #333;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Life Insurance Quote</h1>
            <p>Get an instant quote in seconds</p>
        </div>

        <div class="form-container">
            <form id="quoteForm">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" required>
                    <div class="error" id="fullNameError"></div>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" required>
                    <div class="error" id="dobError"></div>
                    <div class="info-text">Must be between 18 and 85 years old</div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                    <div class="error" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="postcode">Postcode *</label>
                    <input type="text" id="postcode" name="postcode" required placeholder="e.g. SW1A 1AA">
                    <div class="error" id="postcodeError"></div>
                </div>

                <div class="form-group">
                    <label for="coverageAmount">Coverage Amount (£) *</label>
                    <input type="number" id="coverageAmount" name="coverageAmount" min="10000" max="500000" step="10000" required>
                    <div class="error" id="coverageAmountError"></div>
                    <div class="info-text">Between £10,000 and £500,000</div>
                </div>

                <div class="form-group">
                    <label for="occupation">Occupation *</label>
                    <select id="occupation" name="occupation" required>
                        <option value="">-- Select Occupation --</option>
                        <option value="office">Office Worker</option>
                        <option value="manual">Manual Worker</option>
                        <option value="hazardous">Hazardous Occupation</option>
                        <option value="retired">Retired</option>
                    </select>
                    <div class="error" id="occupationError"></div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="smoker" name="smoker">
                        <label for="smoker">I am a smoker</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="medicalConditions" name="medicalConditions">
                        <label for="medicalConditions">I have pre-existing medical conditions</label>
                    </div>
                    <div class="info-text">Applications with medical conditions require manual review</div>
                </div>

                <button type="submit" class="btn">Get Quote</button>
            </form>

            <div id="result" class="result"></div>
        </div>
    </div>

    <script>
        // Pricing configuration
        const PRICING = {
            baseRate: 5, // £5 per £10,000 coverage
            ageMultipliers: {
                under30: 0.8,
                age30to50: 1.0,
                age51to65: 1.5,
                age66plus: 2.0
            },
            smokerMultiplier: 1.5,
            occupationMultipliers: {
                office: 1.0,
                manual: 1.2,
                hazardous: 1.8,
                retired: 1.1
            }
        };

        // Form elements
        const form = document.getElementById('quoteForm');
        const resultDiv = document.getElementById('result');

        // Calculate age from date of birth
        function calculateAge(dob) {
            const today = new Date();
            const birthDate = new Date(dob);
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            
            return age;
        }

        // Get age multiplier
        function getAgeMultiplier(age) {
            if (age < 30) return PRICING.ageMultipliers.under30;
            if (age <= 50) return PRICING.ageMultipliers.age30to50;
            if (age <= 65) return PRICING.ageMultipliers.age51to65;
            return PRICING.ageMultipliers.age66plus;
        }

        // Validate UK postcode format (basic)
        function isValidPostcode(postcode) {
            const postcodeRegex = /^[A-Z]{1,2}\d{1,2}[A-Z]?\s?\d[A-Z]{2}$/i;
            return postcodeRegex.test(postcode.trim());
        }

        // Show error message
        function showError(fieldId, message) {
            const errorDiv = document.getElementById(fieldId + 'Error');
            const field = document.getElementById(fieldId);
            
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            field.classList.add('invalid');
        }

        // Clear error message
        function clearError(fieldId) {
            const errorDiv = document.getElementById(fieldId + 'Error');
            const field = document.getElementById(fieldId);
            
            errorDiv.textContent = '';
            errorDiv.classList.remove('show');
            field.classList.remove('invalid');
        }

        // Clear all errors
        function clearAllErrors() {
            const errorDivs = document.querySelectorAll('.error');
            const fields = document.querySelectorAll('input, select');
            
            errorDivs.forEach(div => {
                div.textContent = '';
                div.classList.remove('show');
            });
            
            fields.forEach(field => {
                field.classList.remove('invalid');
            });
        }

        // Validate form
        function validateForm(formData) {
            let isValid = true;
            clearAllErrors();

            // Full Name
            if (formData.fullName.length < 2 || formData.fullName.length > 100) {
                showError('fullName', 'Name must be between 2 and 100 characters');
                isValid = false;
            }

            // Date of Birth
            const age = calculateAge(formData.dob);
            if (age < 18) {
                showError('dob', 'You must be at least 18 years old');
                isValid = false;
            } else if (age > 85) {
                showError('dob', 'Maximum age is 85 years');
                isValid = false;
            }

            // Email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(formData.email)) {
                showError('email', 'Please enter a valid email address');
                isValid = false;
            }

            // Postcode
            if (!isValidPostcode(formData.postcode)) {
                showError('postcode', 'Please enter a valid UK postcode');
                isValid = false;
            }

            // Coverage Amount
            if (formData.coverageAmount < 10000 || formData.coverageAmount > 500000) {
                showError('coverageAmount', 'Coverage must be between £10,000 and £500,000');
                isValid = false;
            }

            // Occupation
            if (!formData.occupation) {
                showError('occupation', 'Please select an occupation');
                isValid = false;
            }

            return isValid;
        }

        // Calculate quote
        function calculateQuote(formData) {
            const age = calculateAge(formData.dob);

            // Check for referral/decline cases
            if (age < 18 || age > 85) {
                return {
                    status: 'declined',
                    message: 'We are unable to provide cover for applicants outside the age range of 18-85 years.'
                };
            }

            if (formData.medicalConditions) {
                return {
                    status: 'referral',
                    message: 'Thank you for your application. Due to pre-existing medical conditions, your application requires manual review by our underwriting team. We will contact you within 2 business days.',
                    referenceNumber: 'REF-' + Date.now()
                };
            }

            if (formData.coverageAmount > 500000) {
                return {
                    status: 'referral',
                    message: 'Coverage amounts over £500,000 require manual underwriting review. We will contact you within 2 business days.',
                    referenceNumber: 'REF-' + Date.now()
                };
            }

            // Calculate premium
            const basePremium = (formData.coverageAmount / 10000) * PRICING.baseRate;
            const ageMultiplier = getAgeMultiplier(age);
            const smokerMultiplier = formData.smoker ? PRICING.smokerMultiplier : 1.0;
            const occupationMultiplier = PRICING.occupationMultipliers[formData.occupation];

            const annualPremium = basePremium * ageMultiplier * smokerMultiplier * occupationMultiplier;
            const monthlyPremium = annualPremium / 12;

            // Quote expiry (30 days from now)
            const expiryDate = new Date();
            expiryDate.setDate(expiryDate.getDate() + 30);

            return {
                status: 'success',
                quoteId: 'Q-' + Date.now(),
                annualPremium: annualPremium.toFixed(2),
                monthlyPremium: monthlyPremium.toFixed(2),
                coverageAmount: formData.coverageAmount,
                expiryDate: expiryDate.toLocaleDateString('en-GB'),
                breakdown: {
                    basePremium: basePremium.toFixed(2),
                    ageMultiplier: ageMultiplier,
                    smokerMultiplier: smokerMultiplier,
                    occupationMultiplier: occupationMultiplier
                }
            };
        }

        // Display result
        function displayResult(result) {
            resultDiv.className = 'result show ' + result.status;

            if (result.status === 'approved') {
                let breakdownHTML = '';
                if (result.breakdown) {
                    breakdownHTML = '<div class="quote-details" style="margin-top: 20px;">';
                    breakdownHTML += '<div style="font-weight: bold; margin-bottom: 10px;">Premium Breakdown:</div>';
                    breakdownHTML += `<div class="quote-row"><span class="quote-label">Base Premium:</span><span class="quote-value">£${result.breakdown.base_premium.toFixed(2)}</span></div>`;
                    
                    if (result.breakdown.multipliers) {
                        for (const [key, value] of Object.entries(result.breakdown.multipliers)) {
                            const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                            breakdownHTML += `<div class="quote-row"><span class="quote-label">${label}:</span><span class="quote-value">${value}x</span></div>`;
                        }
                    }
                    breakdownHTML += '</div>';
                }

                resultDiv.innerHTML = `
                    <h2>Application Approved!</h2>
                    <div class="quote-details">
                        <div class="quote-row">
                            <span class="quote-label">Application ID:</span>
                            <span class="quote-value">${result.quoteId}</span>
                        </div>
                        <div class="quote-row">
                            <span class="quote-label">Coverage Amount:</span>
                            <span class="quote-value">£${result.coverageAmount.toLocaleString()}</span>
                        </div>
                        <div class="quote-row">
                            <span class="quote-label">Monthly Premium:</span>
                            <span class="quote-value">£${result.monthlyPremium}</span>
                        </div>
                    </div>
                    ${breakdownHTML}
                `;
            } else if (result.status === 'referred') {
                resultDiv.innerHTML = `
                    <h2>Manual Review Required</h2>
                    <p style="margin-bottom: 15px;">${result.reason || 'Your application requires manual review by our underwriting team.'}</p>
                    <div class="quote-row">
                        <span class="quote-label">Reference Number:</span>
                        <span class="quote-value">${result.quoteId}</span>
                    </div>
                `;
            } else if (result.status === 'declined') {
                resultDiv.innerHTML = `
                    <h2>Application Declined</h2>
                    <p style="margin-bottom: 15px;">${result.reason || 'Unfortunately, we cannot offer coverage at this time.'}</p>
                    <div class="quote-row">
                        <span class="quote-label">Reference Number:</span>
                        <span class="quote-value">${result.quoteId}</span>
                    </div>
                `;
            }

            // Scroll to result
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Get form data
            const formData = {
                fullName: document.getElementById('fullName').value.trim(),
                dob: document.getElementById('dob').value,
                email: document.getElementById('email').value.trim(),
                postcode: document.getElementById('postcode').value.trim(),
                coverageAmount: parseInt(document.getElementById('coverageAmount').value),
                occupation: document.getElementById('occupation').value,
                smoker: document.getElementById('smoker').checked,
                medicalConditions: document.getElementById('medicalConditions').checked
            };

            // Validate
            if (!validateForm(formData)) {
                return;
            }

            // Calculate age for API
            const age = calculateAge(formData.dob);

            // Map occupation to API format
            const occupationMap = {
                'office': 'low-risk',
                'manual': 'medium-risk',
                'hazardous': 'high-risk',
                'retired': 'low-risk'
            };

            // Prepare API request
            const apiData = {
                name: formData.fullName,
                age: age,
                smoker: formData.smoker,
                coverage_amount: formData.coverageAmount,
                occupation: occupationMap[formData.occupation],
                pre_existing_conditions: formData.medicalConditions
            };

            // Disable submit button
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Processing...';

            try {
                // Call API
                const response = await fetch('/applications', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(apiData)
                });

                const data = await response.json();

                if (!response.ok) {
                    // Handle validation errors
                    if (response.status === 422) {
                        const errors = data.detail.map(err => `${err.loc.join('.')}: ${err.msg}`).join('\n');
                        alert('Validation Error:\n' + errors);
                    } else {
                        alert('Error: ' + (data.detail || 'An error occurred'));
                    }
                    return;
                }

                // Display result from API
                const result = {
                    status: data.status,
                    quoteId: data.id,
                    monthlyPremium: data.quote ? data.quote.toFixed(2) : null,
                    coverageAmount: formData.coverageAmount,
                    breakdown: data.breakdown,
                    reason: data.reason
                };

                displayResult(result);

            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Get Quote';
            }
        });

        // Clear errors on input
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                clearError(this.id);
            });
        });
    </script>
</body>
</html>
